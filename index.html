<style>
* {

}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: radial-gradient(circle, #c51d32, #650716);
  color: white;
  min-height: 100vh;
  padding: 20px;
}

.app {

  margin: auto;
}

}

.logo {

  color: #ffd36b;

}

.sub {
  color: #ffe8c0;
  margin-top: 8px;
}

.panel {
  background: linear-gradient(145deg, #3a0a12, #170509);
  border: 2px solid #d99b43;
  border-radius: 24px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 10px 30px #0007;
}

h2 {
  color: #ffd36b;
  text-align: center;
}

.counter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  margin: 20px;
}

.counter button {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #c51d32;
  color: white;
  border: 2px solid #ffd36b;
  font-size: 28px;
}

#count {
  font-size: 40px;
  font-weight: bold;
}

.primary {
  width: 100%;
  padding: 16px;
  border: 1px solid #ffd36b;
  border-radius: 15px;
  background: linear-gradient(#ff5968, #97091c);
  color: white;
  font-size: 20px;
  font-weight: bold;
}

.hidden {
  display: none;
}

  <button class="primary" onclick="startGame()">
    ابدأ اللعبة

</section>

<script>
function buildDeck() {
  deck = [];

  roles.forEach(name => {
    deck.push({
      type: "شخصية",
      name: name,
      icon: "🎭"
    });
  });

  situations.forEach(name => {
    deck.push({
      type: "تحدي",
      name: name,
      icon: "🎬"
    });
  });

  surprises.forEach(name => {
    deck.push({
      type: "مفاجأة",
      name: name,
      icon: "✨"
    });
  });

  bonuses.forEach(name => {
    deck.push({
      type: "ميزة",
      name: name,
      icon: "⭐"
    });
  });

  while (deck.length < 120) {
    deck.push({
      type: "مفاجأة",
      name: "ابتكر موقفًا جديدًا وأمتع اللاعبين",
      icon: "✨"
    });
  }

  deck.sort(() => Math.random() - 0.5);

  currentCard = 0;
  currentPlayer = 1;
}

function startGame() {
  buildDeck();

  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  nextCard();
}

function nextCard() {
  if (currentCard >= deck.length) {
    document.getElementById("card").innerHTML =
      "🎉 انتهت الكروت! أعد خلط اللعبة.";
    return;
  }

  const card = deck[currentCard];

  document.getElementById("card").innerHTML = `
    <div style="
      background:#fff0d5;
      color:#7e091b;
      border:5px double #d99b43;
      border-radius:20px;
      padding:35px 15px;
      margin:20px 0;
      text-align:center;
      min-height:220px;
    ">
      <div style="font-size:45px">${card.icon}</div>
      <h2>${card.type}</h2>
      <h3>${card.name}</h3>
      <p>اللاعب رقم ${currentPlayer}</p>
    </div>
  `;

  currentCard++;
  currentPlayer = (currentPlayer % players) + 1;
}
</script>
